# Configuração de build/deploy da Netlify
# Com este arquivo na raiz, a Netlify usa estas configurações automaticamente
# em qualquer deploy conectado ao GitHub.

[build]
  command = "npm run build"
  # Padrão de projetos Next.js na Netlify: o runtime oficial gera o deploy
  # a partir da pasta .next (as chaves do Supabase vão em "Environment
  # variables" das configurações do site, nunca neste arquivo).
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
